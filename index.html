<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tailor Track</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top Header -->
    <header class="top-header">

        <button class="menu-btn">☰</button>

        <h1>Tailor Track</h1>

        <button class="notification-btn">♧</button>

    </header>


    <!-- Main Content -->
    <main>

        <!-- Search Box -->
        <div class="search-box">
            <span class="search-icon">⌕</span>
            <input
                type="text"
                placeholder="Search Customer"
                id="searchInput"
            >
        </div>


        <!-- Customer List -->
        <section class="customer-list">

            <!-- Customer 1 -->
            <div class="customer-card">

                <div class="customer-avatar">
                    RS
                </div>

                <div class="customer-info">
                    <h2>Rahul Sharma</h2>
                    <p>9876543210</p>
                </div>

                <div class="customer-status">
                    <span class="pending">Pending</span>
                    <strong>₹1500</strong>
                </div>

            </div>


            <!-- Customer 2 -->
            <div class="customer-card">

                <div class="customer-avatar">
                    AV
                </div>

                <div class="customer-info">
                    <h2>Aman Verma</h2>
                    <p>9123456780</p>
                </div>

                <div class="customer-status">
                    <span class="completed">Completed</span>
                    <strong>₹0</strong>
                </div>

            </div>


            <!-- Customer 3 -->
            <div class="customer-card">

                <div class="customer-avatar">
                    RS
                </div>

                <div class="customer-info">
                    <h2>Riya Singh</h2>
                    <p>9988776655</p>
                </div>

                <div class="customer-status">
                    <span class="progress">In Progress</span>
                    <strong>₹800</strong>
                </div>

            </div>


            <!-- Customer 4 -->
            <div class="customer-card">

                <div class="customer-avatar">
                    PK
                </div>

                <div class="customer-info">
                    <h2>Pooja Kumari</h2>
                    <p>8877665544</p>
                </div>

                <div class="customer-status">
                    <span class="pending">Pending</span>
                    <strong>₹1200</strong>
                </div>

            </div>

        </section>


        <!-- Add Customer Button -->
        <a href="add-customer.html" class="add-btn">+</a>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <div class="nav-item active">
            <span>⌂</span>
            <p>Home</p>
        </div>

        <div class="nav-item">
            <span>♟</span>
            <p>Customers</p>
        </div>

        <div class="nav-item">
            <span>●</span>
            <p>Profile</p>
        </div>

    </nav>


    <!-- Footer -->
    <footer>
        <p>Developed by Nidhi Yadav</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
